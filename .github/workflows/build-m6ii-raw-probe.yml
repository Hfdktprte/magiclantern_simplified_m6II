name: Build M6II RAW probe

on:
  push:
    branches:
      - m6ii-raw-probe-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi zip python3 python3-docutils

      - name: Show toolchain
        run: |
          arm-none-eabi-gcc --version
          python3 --version
          rst2html --version || rst2html5 --version
          make --version | head -1

      - name: Build EOS M6 Mark II 1.1.1 package
        run: |
          make -C platform/M6II.111 -j2

      - name: Verify package
        run: |
          test -s platform/M6II.111/build/magiclantern.zip
          sha256sum platform/M6II.111/build/magiclantern.zip | tee platform/M6II.111/build/magiclantern.zip.sha256
          unzip -l platform/M6II.111/build/magiclantern.zip

      - name: Upload SD-card package
        uses: actions/upload-artifact@v4
        with:
          name: M6II-111-raw-probe-v1
          path: |
            platform/M6II.111/build/magiclantern.zip
            platform/M6II.111/build/magiclantern.zip.sha256
          if-no-files-found: error
          retention-days: 14
