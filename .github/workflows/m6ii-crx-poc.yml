name: M6II CRX MLV POC build

on:
  push:
    branches:
      - M6II-CRX-MLV-POC
  pull_request:
    branches:
      - M6II-MLV-Experiments
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-m6ii:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            python3 \
            python3-docutils \
            python3-setuptools \
            zip

      - name: Clean modules and M6II
        run: |
          make -C modules clean
          make -C platform/M6II.111 clean

      - name: Build EOS M6 Mark II 1.1.1
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          make -C platform/M6II.111 FATAL_WARNINGS=n -j2 2>&1 | tee artifacts/build.log
          status=${PIPESTATUS[0]}
          echo "build_status=$status" >> "$GITHUB_ENV"
          exit "$status"

      - name: Collect build
        if: success()
        run: |
          cp platform/M6II.111/build/autoexec.bin artifacts/
          cp platform/M6II.111/build/magiclantern.zip artifacts/
          cp modules/raw_video/mlv_lite/build/mlv_lite.mo artifacts/

      - name: Upload M6II CRX build/log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M6II-CRX-MLV-POC
          path: artifacts/
          if-no-files-found: error
